version: "3.3"

services:
  skiresort-api:
    container_name: skiresort-api
    restart: always
    image: node:20.19.0
    ports:
      - 4001:3000
    volumes:
      - ./:/usr/src/skiresort
    working_dir: /usr/src/skiresort
    environment:
      PORT_API: 3000

    networks:
      - monorepo-network

    # FOR PRODUCTION
    command: bash -c "npm install && npm run build && npm run start:prod"

  skiresort-batch:
    container_name: skiresort-batch
    restart: always
    image: node:20.19.0
    ports:
      - 4002:3001
    volumes:
      - ./:/usr/src/skiresort
    working_dir: /usr/src/skiresort
    environment:
      PORT_BATCH: 3001

    networks:
      - monorepo-network

    # FOR PRODUCTION
    command: bash -c "rm -rf dist && npm install && npm run build && npm run start:prod:batch"

networks:
  monorepo-network:
    driver: bridge
